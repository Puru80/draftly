spring.application.name=draftly-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/draftly
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=https://www.googleapis.com/auth/userinfo.email,https://www.googleapis.com/auth/gmail.readonly,https://www.googleapis.com/auth/gmail.compose,https://www.googleapis.com/auth/gmail.modify
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.access-type=offline
spring.security.oauth2.client.registration.google.prompt=consent

# Encryption properties for token safety
app.security.secret-key=${ENCRYPTION_SECRET_KEY:super-secret-32-byte-key-for-aes}

spring.ai.gemini.api-key=${GEMINI_API_KEY}
spring.ai.gemini.model=gemini-flash
